<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }
    header {
      padding: 14px 16px;
      background: #111827;
      color: #ffffff;
    }
    h1 {
      margin: 0;
      font-size: 16px;
    }
    main {
      padding: 12px;
    }
    .status {
      margin-bottom: 10px;
      font-size: 12px;
      color: #475569;
    }
    .settings {
      display: grid;
      gap: 8px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #ffffff;
    }
    label {
      font-size: 12px;
      color: #475569;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
    }
    button {
      justify-self: end;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      padding: 7px 10px;
      background: #111827;
      color: #ffffff;
      font-size: 12px;
      cursor: pointer;
    }
    .prompt {
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #ffffff;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11px;
      color: #64748b;
    }
    .text {
      max-height: 76px;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.35;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Prompt Monitor</h1>
  </header>
  <main>
    <section class="settings">
      <label for="apiBaseUrl">Backend API URL</label>
      <input id="apiBaseUrl" placeholder="https://your-app.onrender.com">
      <button id="saveApiBaseUrl" type="button">Save</button>
    </section>
    <div class="status" id="status">Loading recent captures...</div>
    <div id="prompts"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
